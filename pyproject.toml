[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-graphrag"
version = "0.1.0"
description = "Full-stack GraphRAG with hierarchical (small-to-big) indexing and a Neo4j knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanober Rehman" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "langchain-text-splitters>=0.3",
    "qdrant-client>=1.12",
    "neo4j>=5.26",
    "openai>=1.55",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "pypdf>=5.1",
    "python-multipart>=0.0.12",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools]
# The backend package (`app`) lives under backend/; it is added to the import
# path for tests via tool.pytest pythonpath, and installed directly in Docker
# (WORKDIR is the backend/ dir so `app` is importable there too). This root
# project is dependency-only, so no packages are discovered/installed here.
packages = []

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require live Neo4j and Qdrant services",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
